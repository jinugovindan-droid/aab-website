<body>
  <div id="root"></div>

  <script type="text/babel" src="scripts/tweaks-panel.jsx?v=20260522"></script>
  <script type="text/babel" src="scripts/chrome.jsx?v=20260522"></script>
  <script type="text/babel" src="scripts/page-home.jsx?v=20260522"></script>
  <script type="text/babel" src="scripts/page-services.jsx?v=20260522"></script>
  <script type="text/babel" src="scripts/page-einvoicing.jsx?v=20260522"></script>
  <script type="text/babel" src="scripts/page-other.jsx?v=20260522"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "displayFont": "Oswald",
      "accentIntensity": "default",
      "density": "comfortable",
      "showSubBar": true
    }/*EDITMODE-END*/;

    const PAGE_LABELS = {
      home: '01 Home',
      services: '02 Services',
      'service-vat': '03 Service · VAT',
      'e-invoicing': '04 E-Invoicing',
      industries: '05 Industries',
      about: '06 About',
      insights: '07 Insights',
      insight: '08 Insight Article',
      careers: '09 Careers',
      contact: '10 Contact',
    };

    function AppRoot() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [page, setPage] = useState('home');
      useScrollReveal();

      useEffect(() => {
        document.documentElement.style.setProperty('--aa-font-display',
          tweaks.displayFont === 'Archivo Black'
            ? "'Archivo Black','Archivo','Antique Olive',sans-serif"
            : "'Oswald','Archivo','Antique Olive',sans-serif");

        const accent = tweaks.accentIntensity === 'bold' ? '#0E8FC9'
                     : tweaks.accentIntensity === 'soft' ? '#5BBEE9'
                     : '#29ABE2';
        document.documentElement.style.setProperty('--aa-cyan', accent);

        document.body.setAttribute('data-density', tweaks.density);
      }, [tweaks]);

      // Lucide must run after any render that adds [data-lucide] nodes
      // (page change, FAQ open, wizard step, filter change). rAF debounces to one
      // pass per paint so we don't pay 50× during a single state update.
      useEffect(() => {
        const id = requestAnimationFrame(() => {
          if (window.lucide) window.lucide.createIcons();
        });
        return () => cancelAnimationFrame(id);
      });

      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, [page]);

      const renderPage = () => {
        switch (page) {
          case 'home': return <HomePage onNav={setPage}/>;
          case 'services': return <ServicesPage onNav={setPage}/>;
          case 'service-vat': return <ServiceVATPage onNav={setPage}/>;
          case 'e-invoicing': return <EInvoicingPage onNav={setPage}/>;
          case 'industries': return <IndustriesPage onNav={setPage}/>;
          case 'about': return <AboutPage onNav={setPage}/>;
          case 'insights': return <InsightsPage onNav={setPage}/>;
          case 'insight': return <InsightArticlePage onNav={setPage}/>;
          case 'careers': return <CareersPage onNav={setPage}/>;
          case 'contact': return <ContactPage onNav={setPage}/>;
          default: return <HomePage onNav={setPage}/>;
        }
      };

      const navActive = page === 'service-vat' ? 'services' : page === 'insight' ? 'insights' : page;

      return (
        <div data-screen-label={PAGE_LABELS[page] || page}>
          {tweaks.showSubBar && <SubBar/>}
          <TopNav active={navActive} onNav={setPage}/>
          <main>{renderPage()}</main>
          <Footer onNav={setPage}/>
          <WhatsAppFab/>

          <TweaksPanel title="Tweaks">
            <TweakSection title="Typography">
              <TweakRadio
                label="Display font"
                value={tweaks.displayFont}
                options={[{value:'Oswald',label:'Oswald'},{value:'Archivo Black',label:'Archivo Black'}]}
                onChange={v => setTweak('displayFont', v)}
              />
            </TweakSection>
            <TweakSection title="Accent">
              <TweakRadio
                label="Cyan intensity"
                value={tweaks.accentIntensity}
                options={[{value:'soft',label:'Soft'},{value:'default',label:'Default'},{value:'bold',label:'Bold'}]}
                onChange={v => setTweak('accentIntensity', v)}
              />
            </TweakSection>
            <TweakSection title="Layout">
              <TweakRadio
                label="Density"
                value={tweaks.density}
                options={[{value:'comfortable',label:'Comfortable'},{value:'compact',label:'Compact'}]}
                onChange={v => setTweak('density', v)}
              />
              <TweakToggle
                label="Show regulator sub-bar"
                value={tweaks.showSubBar}
                onChange={v => setTweak('showSubBar', v)}
              />
            </TweakSection>
            <TweakSection title="Quick navigation">
              <TweakSelect
                label="Jump to page"
                value={page}
                options={Object.entries(PAGE_LABELS).map(([v,l])=>({value:v,label:l}))}
                onChange={v => setPage(v)}
              />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AppRoot/>);
  </script>
