<!doctype html>
<html lang="en-AE">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <title>Page not found — Authentic Accounting</title>
  <style>
    :root { --charcoal:#1A1A2E; --cyan:#00B0F0; --cyan-700:#00B0F0; --steel:#6E7887; --rule:#E4E5E7; }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif; color: var(--charcoal); background:#fff;
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { max-width:560px; width:100%; border:1px solid var(--rule); border-top:3px solid var(--cyan); padding:48px 40px; text-align:center; }
    .card img { height:64px; margin:0 auto 28px; display:block; }
    .code { font-size:13px; letter-spacing:.14em; color:var(--cyan-700); font-weight:600; text-transform:uppercase; }
    h1 { font-size:clamp(28px,6vw,40px); line-height:1.1; margin:10px 0 14px; text-transform:uppercase; letter-spacing:.01em; }
    p { color:var(--steel); font-size:15px; line-height:1.6; }
    .links { margin-top:28px; display:flex; gap:10px 22px; justify-content:center; flex-wrap:wrap; }
    .links a { color:var(--cyan-700); font-weight:600; font-size:14px; text-decoration:none; }
    .links a:hover { text-decoration:underline; }
    .btn { display:inline-block; margin-top:26px; background:var(--charcoal); color:var(--cyan); border:1px solid var(--cyan); font-weight:600; font-size:14px;
           padding:12px 22px; text-decoration:none; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/logos/aab-short-eng-classic.png" alt="Authentic Accounting"/>

    <a class="btn" href="/">Go to the homepage</a>
    <nav class="links" aria-label="Popular pages">
      <a href="/services">Services</a>
      <a href="/services/corporate-tax">Corporate Tax</a>
      <a href="/services/vat">VAT</a>
      <a href="/e-invoicing">E-Invoicing</a>
      <a href="/insights">Insights</a>
      <a href="/contact">Contact</a>
    </nav>
  </main>
</body>
</html>
